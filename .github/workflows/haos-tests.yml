name: HAOS bridge tests
on:
  pull_request:
    paths:
      - 'sbfspot_mqtt/**'
      - 'tests/**'
      - '.github/workflows/haos-tests.yml'
  push:
    branches: [main]
    paths:
      - 'sbfspot_mqtt/**'
      - 'tests/**'
      - '.github/workflows/haos-tests.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.14.3
      - name: Lint bridge
        run: ruff check --select E4,E7,E9,F,B,S102,S307,S602,S604,S605,S606 sbfspot_mqtt/bridge.py
      - run: python -m unittest discover -s tests -v
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build actual amd64 add-on image
        run: docker build -t sma-sbfspot-haos:test sbfspot_mqtt
      - name: Verify real binary links and isolated Python dependencies
        run: |
          docker run --rm --network none --cap-drop ALL --entrypoint sh sma-sbfspot-haos:test -c 'ldd /usr/local/bin/SBFspot && python3 -I -c "import paho.mqtt.client; import zoneinfo"'
      - name: MQTT and upgrade integration test without extra capabilities
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            -e RUN_HAOS_SMOKE_TEST=1 \
            -v "$PWD/tests/smoke_haos.py:/test.py:ro" \
            --entrypoint python3 sma-sbfspot-haos:test -I -u -B /test.py
