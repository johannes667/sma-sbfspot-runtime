name: HAOS bridge tests
on:
  pull_request:
    paths:
      - 'sbfspot_mqtt/**'
      - 'tests/**'
      - '.github/workflows/haos-tests.yml'
  push:
    branches: [main]
    paths:
      - 'sbfspot_mqtt/**'
      - 'tests/**'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
