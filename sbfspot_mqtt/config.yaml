name: SMA SBFspot MQTT
version: "1.2.2"
slug: sbfspot_mqtt
description: SMA über Bluetooth oder Sunny WebBox LAN mit MQTT bei Wertänderungen
url: https://github.com/johannes667/sma-sbfspot-runtime
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW
apparmor: false
hassio_api: true
services:
  - mqtt:want
options:
  source: bluetooth
  webbox_host: ""
  webbox_port: 80
  webbox_password: ""
  webbox_device_key: ""
  webbox_timeout_seconds: 10
  webbox_diagnostics: false
  webbox_channels: []
  inverter_bluetooth_address: "00:00:00:00:00:00"
  local_bluetooth_address: ""
  inverter_password: "0000"
  timezone: Europe/Berlin
  poll_seconds: 30
  retry_seconds: 5
  stale_after_seconds: 180
  log_level: info
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  mqtt_base_topic: sma/sbfspot
  discovery: true
  discovery_prefix: homeassistant
  device_id: sma_sbfspot
  device_name: SMA Wechselrichter
schema:
  source: list(bluetooth|webbox)
  webbox_host: str?
  webbox_port: port
  webbox_password: password?
  webbox_device_key: str?
  webbox_timeout_seconds: int(1,60)
  webbox_diagnostics: bool
  webbox_channels:
    - sensor: str
      channel: str
  inverter_bluetooth_address: str?
  local_bluetooth_address: str?
  inverter_password: password?
  timezone: str
  poll_seconds: int(10,3600)
  retry_seconds: int(1,60)
  stale_after_seconds: int(30,7200)
  log_level: list(info|debug)
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool
  mqtt_base_topic: str
  discovery: bool
  discovery_prefix: str
  device_id: match(^[a-zA-Z0-9_-]+$)
  device_name: str
